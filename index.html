<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <title>Personal Ebook Library</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pustaka">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <script>
    // Terapkan tema tersimpan sebelum render agar layar tidak berkedip.
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <main id="view" tabindex="-1"></main>
  <nav id="bottom-nav" aria-label="Navigasi utama"></nav>
  <noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
